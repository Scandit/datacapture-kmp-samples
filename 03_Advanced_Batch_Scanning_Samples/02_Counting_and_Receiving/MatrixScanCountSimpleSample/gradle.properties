#Gradle
# Heap bump mirrors the DebugApp: Kotlin/Native's iosArm64 link step pushes
# the K/N compiler past 2 GB once Compose Multiplatform is in the link unit.
# Same value covers both the Gradle JVM and the Kotlin compile daemon.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6144M"
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
